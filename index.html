<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daryn | Roblox Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #111216;
            color: #FFF;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background: #191B1D;
            border: 3px solid #232527;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 0 #000;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #232527;
            padding-bottom: 15px;
        }
        .logo { font-family: 'Fredoka One', cursive; font-size: 24px; color: #FFF; }
        .logo span { color: #00A2FF; }
        .badge { background: #232527; padding: 8px 16px; border-radius: 20px; color: #00E676; font-weight: 800; border: 2px solid #393B3D; }
        .hero {
            background: linear-gradient(135deg, #00A2FF 0%, #0055FF 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 8px 0 #003399;
        }
        .hero h1 { font-family: 'Fredoka One', cursive; margin: 0; font-size: 32px; }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .card { background: #232527; border: 2px solid #393B3D; padding: 20px; border-radius: 12px; box-shadow: 0 5px 0 #151618; }
        .card h3 { font-family: 'Fredoka One', cursive; color: #00E676; margin-top: 0; }
        .btn {
            display: block;
            text-align: center;
            background: #00E676;
            color: #111;
            font-family: 'Fredoka One', cursive;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            margin-top: 25px;
            box-shadow: 0 6px 0 #00994D;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">ROBLOX <span>PORTFOLIO</span></div>
            <div class="badge">R$ 1,000,000</div>
        </div>
        <div class="hero">
            <h1>MY AI-POWERED WEBSITE</h1>
            <p>Daryn • 1st-year IITU Student</p>
        </div>
        <div class="cards">
            <div class="card">
                <h3>🎮 OBJECTIVE</h3>
                <p>Personal website combining AI, Cybersecurity, and Judo discipline.</p>
            </div>
            <div class="card">
                <h3>⚡ SKILLS</h3>
                <p>• Cybersecurity<br>• Cloud Technologies<br>• AI Integration</p>
            </div>
        </div>
        <a href="#" class="btn">▶ START GAME</a>
    </div>
</body>
</html>
